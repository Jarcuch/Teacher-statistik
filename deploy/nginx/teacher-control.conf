limit_req_zone $binary_remote_addr zone=teacher_login_per_ip:1m rate=6r/m;

server {
    listen 192.0.2.10:443 ssl;
    server_name 198.51.100.10;

    ssl_certificate /etc/nginx/teacher-control-tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/teacher-control-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 5m;
    limit_req_status 429;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;

    location = / { return 302 /teacher_control/$is_args$args; }
    location = /index.html { return 302 /teacher_control/$is_args$args; }
    location = /teacher_control { return 308 /teacher_control/$is_args$args; }

    # Retire the former origin-wide service worker on existing devices.
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        return 200 "self.addEventListener('install', () => self.skipWaiting()); self.addEventListener('activate', e => e.waitUntil(self.registration.unregister()));";
    }

    location = /teacher_control/login {
        limit_req zone=teacher_login_per_ip burst=5 nodelay;
        proxy_pass http://127.0.0.1:3001/login;
    }

    location /teacher_control/ {
        proxy_pass http://127.0.0.1:3001/;
    }

    location / { return 404; }
}
